name: Keep site awake

# Render's free plan puts the site to sleep after 15 minutes without traffic,
# and the next visitor waits ~50 seconds for it to wake. Pinging every 14
# minutes during the day keeps it warm.
#
# Hours are limited on purpose: all services in the Render workspace share 750
# free instance hours a month. 12:00-04:59 UTC (about 8am-1am US Eastern in
# summer, 7am-midnight in winter) uses ~510 hours, leaving the rest for the
# other services. Widen or narrow the second cron field to change that.
#
# Notes: GitHub may start scheduled runs a few minutes late, and it pauses
# schedules in repositories with no activity for 60 days (re-enable it from
# the Actions tab).

on:
  schedule:
    - cron: "*/14 12-23,0-4 * * *"
  workflow_dispatch: # allow a manual run from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the site
        # /api/session is cheap: for a visitor without a session it never
        # touches the database. Retries cover the ~50s cold start.
        run: >
          curl --fail --silent --show-error --max-time 90
          --retry 3 --retry-delay 10 --retry-all-errors
          -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n"
          https://galactic-getaways-zklm.onrender.com/api/session
